syntax = "proto3";

package proto;

option go_package = "gotest/grpc/proto";

// Service Definition
service ProductService {
  rpc GetProduct (GetProductRequest) returns (ProductResponse);
  rpc CreateProduct (CreateProductRequest) returns (ProductResponse);
  rpc ListProducts (ListProductsRequest) returns (stream ProductResponse); // Server Streaming RPC
}

// Message Definitions
message GetProductRequest {
  uint32 id = 1;
}

message CreateProductRequest {
  string name = 1;
  double price = 2;
  int32 stock = 3;
}

message ListProductsRequest {}

message ProductResponse {
  uint32 id = 1;
  string name = 2;
  double price = 3;
  int32 stock = 4;
}
